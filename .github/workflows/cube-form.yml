name: Cube Form — сборка мода
on:
  push:
    paths: ["cube-form/**",".github/workflows/cube-form.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: cube-form
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.12 }
      - name: Сборка
        shell: bash
        run: |
          set +e
          gradle build --stacktrace > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E "error:|What went wrong|Could not|FAILED|Caused by|not find|Unsupported|symbol|location:" build.log | head -25 | tr '\n' '|' | sed 's/%/%25/g' > summary.txt
            echo "::error title=Ошибка сборки::$(cat summary.txt | cut -c1-1500)"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: cube-form
          path: cube-form/build/libs/cube-form-*.jar
      - name: Release
        if: github.ref == 'refs/heads/main'
        run: |
          f=$(ls build/libs/cube-form-*.jar | grep -v sources | head -1)
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "$f" --title "Cube Form (последняя сборка)" --notes "Скачай файл .jar и положи в папку mods. Minecraft 1.21.1 + Fabric + Fabric API."
        env:
          GH_TOKEN: ${{ github.token }}
