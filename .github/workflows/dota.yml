name: Дота — ежедневный снимок
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node dota/snapshot.js
      - name: Сохранить снимок
        run: |
          git config user.name "dota-bot"
          git config user.email "dota-bot@users.noreply.github.com"
          git add dota/data/history.json
          git diff --cached --quiet || (git commit -m "Дота: снимок за $(date -u +%F)" && git pull --rebase -q && git push)
