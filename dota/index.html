<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07061a">
<title>Дота: герои и сборки</title>
<meta name="description" content="Винрейт героев Доты, что собирать и против кого герой силён. Данные OpenDota.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07061a;--card:rgba(255,255,255,.06);--line:rgba(255,255,255,.1);--ink:#f2f3ff;--mut:#a9aed6;--ac:#a77bff;--up:#5ee68a;--dn:#ff6b7d;--head:"Unbounded","Manrope",system-ui,sans-serif;--body:"Manrope","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 15px/1.4 var(--body)}
body{min-height:100vh;background:radial-gradient(900px 500px at 80% -10%,rgba(167,123,255,.22),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(94,242,255,.1),transparent 60%),var(--bg);padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:760px;margin:0 auto}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.back{display:inline-flex;align-items:center;height:40px;padding:0 16px;border-radius:99px;background:var(--card);color:var(--ink);text-decoration:none;font-weight:800;border:1px solid var(--line)}
h1{margin:0;font:700 clamp(18px,5vw,26px)/1.1 var(--head);letter-spacing:-.01em}
.meta{color:var(--mut);font-size:13px;margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
#rk,#at{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}#rk::-webkit-scrollbar,#at::-webkit-scrollbar{display:none}.chip{flex:none;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:700 14px var(--body);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ac);color:#0a0820;border-color:var(--ac)}
input[type=search],select{height:42px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 15px var(--body);padding:0 14px;min-width:0}
input[type=search]{flex:1 1 160px}
.list{display:grid;gap:8px;margin-top:6px}
.h{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 12px;border-radius:16px;background:var(--card);border:1px solid var(--line);cursor:pointer;text-align:left;color:inherit;font:inherit;width:100%}
.h:active{transform:scale(.985)}
.ic{width:44px;height:44px;border-radius:10px;background:#15123a;object-fit:cover}
.nm{font-weight:800;font-size:16px}
.sub{color:var(--mut);font-size:12.5px;margin-top:2px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.1);margin-top:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,#5ef2ff,#a77bff)}
.wr{text-align:right;font:700 18px var(--head)}
.d{display:block;font:800 12px var(--body);margin-top:3px}
.up{color:var(--up)}.dn{color:var(--dn)}.fl{color:var(--mut)}
.note{color:var(--mut);font-size:13px;margin:14px 0 0}
dialog{width:min(640px,100vw);max-width:100vw;max-height:92vh;margin:auto auto 0;padding:0;border:0;border-radius:24px 24px 0 0;background:#0e0c2b;color:var(--ink);overflow:auto}
@media(min-width:700px){dialog{margin:auto;border-radius:24px}}
dialog::backdrop{background:rgba(3,2,14,.7);backdrop-filter:blur(4px)}
.sheet{padding:18px 18px max(24px,env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.top .ic{width:56px;height:56px;border-radius:12px}
.x{margin-left:auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:20px;cursor:pointer}
h3{margin:20px 0 8px;font:700 14px var(--head);letter-spacing:.02em}
.rk{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;align-items:end;height:110px}
.rk div{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:11px;color:var(--mut);height:100%}
.rk b{display:block;width:100%;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,#a77bff,#5ef2ff);min-height:3px}
.rk span{color:var(--ink);font-weight:800;font-size:11px}
.items{display:flex;flex-wrap:wrap;gap:8px}
.it{width:62px;text-align:center;font-size:11px;color:var(--mut)}
.it img{width:58px;height:43px;border-radius:7px;object-fit:cover;background:#15123a;display:block}
.ph{color:var(--mut);font-size:12px;margin:10px 0 6px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.vs{grid-template-columns:1fr}}
.vr{display:flex;align-items:center;gap:10px;padding:6px 0;font-weight:700}
.vr .ic{width:34px;height:34px;border-radius:8px}
.vr em{margin-left:auto;font-style:normal;font-weight:800}
.err{padding:18px;border-radius:16px;border:1px solid var(--dn);color:#ffd3d9;margin-top:10px}
.sk{height:64px;border-radius:16px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){.sk{animation:none}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="back" href="../">‹ Хаб</a><h1>Дота: герои и сборки</h1></header>
<p class="meta" id="meta">Загружаю данные…</p>
<div class="row" id="rk" role="group" aria-label="Ранг игроков"></div>
<div class="row" id="at" role="group" aria-label="Атрибут героя"></div>
<div class="row"><input type="search" id="q" placeholder="Найти героя" aria-label="Найти героя"><select id="so" aria-label="Сортировка"><option value="wr">Сначала сильные</option><option value="pk">Сначала популярные</option><option value="dl">Больше всего выросли</option><option value="dd">Больше всего упали</option></select><select id="cmp" aria-label="С чем сравнить"></select></div>
<div class="list" id="ls"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div>
<p class="note">Данные: OpenDota (обычные игры). Герои с малым числом матчей не попадают в верх списка, чтобы цифры не врали.</p>
</div>
<dialog id="dl"><div class="sheet" id="sh"></div></dialog>
<script src="app.js"></script>
</body>
</html>
